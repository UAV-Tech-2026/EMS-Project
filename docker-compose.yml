version: "3.9"

services:
  db:
    image: postgres:16
    container_name: ems-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: ems_dbs1
    ports:
      - "5432:5432"
    volumes:
      - ems_postgres:/var/lib/postgresql/data

volumes:          # 👈 this was missing
  ems_postgres:
    name: ems_postgres 